name: CI

on:
  push:
    branches:
      - main
      - v0
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_TELEMETRY_DISABLED: '1'

jobs:
  static-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - run: bun run prepare
      - run: bun verify static fast-js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verify-artifacts-static-fast
          path: verify/artifacts/
          if-no-files-found: ignore

  # Release builds with the JS bundle embedded (no Metro), test mode on.
  # Native outputs are cached on native inputs only, so a JS-only change re-bundles but reuses the native build.
  e2e-android-bare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: example
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable the Gradle build cache (setup-gradle persists it)
        run: echo "org.gradle.caching=true" >> example/android/gradle.properties
      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            android/build
            android/.cxx
            example/android/app/.cxx
            example/android/build
            example/node_modules/react-native-nitro-modules/android/build
            example/node_modules/react-native-nitro-modules/android/.cxx
          key: android-native-${{ hashFiles('android/**', 'nitrogen/**', 'patches/**', 'example/android/**', 'bun.lock', 'example/bun.lock') }}
      - name: Build release APK (test mode)
        working-directory: example/android
        env:
          OTEL_TEST_MODE: '1'
        run: ./gradlew :app:assembleRelease -PotelTestMode=true -PreactNativeArchitectures=x86_64
      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-x86_64-google_apis
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: e2e (android-bare)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_TARGET: android-bare
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bun verify --e2e e2e
      - uses: actions/upload-artifact@v4
        if: always() # e2e retries once; keep traces of retried and failed attempts
        with:
          name: verify-artifacts-e2e-android-bare
          path: |
            verify/artifacts/
            verify/e2e/.e2e/
          if-no-files-found: ignore

  e2e-ios-bare:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: example
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: example/ios/build/SourcePackages
          key: ios-spm-${{ hashFiles('example/ios/OpenTelemetryExample.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            example/ios/Pods
            example/ios/build/Build
          key: ios-native-${{ hashFiles('ios/**', 'nitrogen/**', 'ReactNativeOpenTelemetry.podspec', 'example/ios/Podfile', 'example/ios/Podfile.lock', 'example/ios/OpenTelemetryExample/**', 'example/ios/OpenTelemetryExample.xcodeproj/**', 'bun.lock', 'example/bun.lock') }}
      - name: pod install (test mode)
        working-directory: example/ios
        env:
          OTEL_TEST_MODE: '1'
        run: pod install
      - name: Build release app (test mode)
        working-directory: example/ios
        env:
          OTEL_TEST_MODE: '1'
        run: >
          xcodebuild -workspace OpenTelemetryExample.xcworkspace -scheme OpenTelemetryExample
          -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build ARCHS=arm64 build
      - name: e2e (ios-bare)
        env:
          E2E_TARGET: ios-bare
        run: bun verify --e2e e2e
      - uses: actions/upload-artifact@v4
        if: always() # e2e retries once; keep traces of retried and failed attempts
        with:
          name: verify-artifacts-e2e-ios-bare
          path: |
            verify/artifacts/
            verify/e2e/.e2e/
          if-no-files-found: ignore

  budget:
    needs: [static-fast, e2e-android-bare, e2e-ios-bare] # every other job; extend when jobs are added
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR time budget
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET: ${{ vars.PR_BUDGET_MINUTES }}
        run: |
          started=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          minutes=$(( ($(date +%s) - $(date -d "$started" +%s)) / 60 ))
          echo "CI duration: ${minutes} min (budget: ${BUDGET:-unset})"
          if [ -n "$BUDGET" ] && ! [[ "$BUDGET" =~ ^[0-9]+$ ]]; then
            echo "::error::PR_BUDGET_MINUTES must be a whole number, got '$BUDGET'"
            exit 1
          fi
          if [ -n "$BUDGET" ] && [ "$minutes" -gt "$BUDGET" ]; then
            echo "::error::CI took ${minutes} min, over the ${BUDGET} min budget"
            exit 1
          fi
