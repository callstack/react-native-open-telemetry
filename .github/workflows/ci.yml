name: CI

on:
  push:
    branches:
      - main
      - v0
  pull_request:
    branches:
      - main
      - v0
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_TELEMETRY_DISABLED: '1'

jobs:
  static-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - run: bun run prepare
      - run: bun verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-artifacts-static-fast
          path: verify/artifacts/
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-android-bare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: example
      - run: bun run prepare
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable the Gradle build cache (setup-gradle persists it)
        run: printf '\norg.gradle.caching=true\n' >> example/android/gradle.properties
      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            android/build
            android/.cxx
            example/android/app/.cxx
            example/android/build
            example/node_modules/react-native-nitro-modules/android/build
            example/node_modules/react-native-nitro-modules/android/.cxx
          key: android-native-${{ hashFiles('android/**', 'nitrogen/**', 'patches/**', 'example/android/**', 'example/modules/**', 'bun.lock', 'example/bun.lock') }}
      - name: Build release APK (test mode)
        working-directory: example/android
        env:
          OTEL_TEST_MODE: '1'
        run: |
          ./gradlew :app:assembleRelease -PotelTestMode=true -PreactNativeArchitectures=x86_64 ||
            ./gradlew :app:assembleRelease -PotelTestMode=true -PreactNativeArchitectures=x86_64
      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-x86_64-google_apis
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: e2e (android-bare)
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_TARGET: android-bare
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put global hide_error_dialogs 1
            bun verify --e2e e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-artifacts-e2e-android-bare
          path: |
            verify/artifacts/
            verify/e2e/.e2e/
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-ios-bare:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: example
      - run: bun run prepare
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: example/ios/build/SourcePackages
          key: ios-spm-${{ hashFiles('example/ios/OpenTelemetryExample.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            example/ios/Pods
            example/ios/build/Build
          key: ios-native-${{ hashFiles('ios/**', 'nitrogen/**', 'ReactNativeOpenTelemetry.podspec', 'ReactNativeOpenTelemetryCore.podspec', 'example/ios/Podfile', 'example/ios/Podfile.lock', 'example/ios/OpenTelemetryExample/**', 'example/ios/OpenTelemetryExample.xcodeproj/**', 'example/modules/**', 'bun.lock', 'example/bun.lock') }}
      - name: pod install (test mode)
        working-directory: example/ios
        env:
          OTEL_TEST_MODE: '1'
        run: pod install
      - name: Build release app (test mode)
        working-directory: example/ios
        env:
          OTEL_TEST_MODE: '1'
        run: >
          xcodebuild -workspace OpenTelemetryExample.xcworkspace -scheme OpenTelemetryExample
          -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build ARCHS=arm64 build
      - name: Pre-boot the simulator (a cold boot on the runner outlasts agent-device's boot timeout)
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: e2e (ios-bare)
        timeout-minutes: 30
        env:
          E2E_TARGET: ios-bare
          AGENT_DEVICE_DAEMON_STARTUP_TIMEOUT_MS: '600000'
        run: bun verify --e2e e2e
      - name: Diagnose the simulator log
        if: failure()
        timeout-minutes: 4
        run: |
          echo "--- RNOtel lines"; xcrun simctl spawn booted log show --last 10m --info --style compact --predicate 'eventMessage CONTAINS "RNOtel"' | tail -20
          echo "--- app process lines"; xcrun simctl spawn booted log show --last 10m --info --style compact --predicate 'process == "OpenTelemetryExample"' | tail -20
          date; echo "$TZ"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: agent-device-state-e2e-ios-bare
          path: ~/.agent-device/
          if-no-files-found: ignore
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-artifacts-e2e-ios-bare
          path: |
            verify/artifacts/
            verify/e2e/.e2e/
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-android-expo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: example-expo
      - run: bun run prepare
      - name: expo prebuild (test mode)
        working-directory: example-expo
        env:
          OTEL_TEST_MODE: '1'
        run: bunx expo prebuild --clean --no-install --platform android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable the Gradle build cache (setup-gradle persists it)
        run: printf '\norg.gradle.caching=true\n' >> example-expo/android/gradle.properties
      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            android/build
            android/.cxx
            example-expo/android/app/.cxx
            example-expo/android/build
            example-expo/node_modules/react-native-nitro-modules/android/build
            example-expo/node_modules/react-native-nitro-modules/android/.cxx
          key: android-expo-native-${{ hashFiles('android/**', 'nitrogen/**', 'patches/**', 'example-expo/app.json', 'example-expo/plugins/**', 'example/modules/**', 'bun.lock', 'example-expo/bun.lock') }}
      - name: Build release APK (test mode)
        working-directory: example-expo/android
        env:
          OTEL_TEST_MODE: '1'
        run: |
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 ||
            ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64
      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-x86_64-google_apis
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: e2e (android-expo)
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_TARGET: android-expo
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put global hide_error_dialogs 1
            bun verify --e2e e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-artifacts-e2e-android-expo
          path: |
            verify/artifacts/
            verify/e2e/.e2e/
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-ios-expo:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: example-expo
      - run: bun run prepare
      - name: expo prebuild
        working-directory: example-expo
        run: bunx expo prebuild --clean --no-install --platform ios
      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            example-expo/ios/Pods
            example-expo/ios/build/Build
            example-expo/ios/build/SourcePackages
          key: ios-expo-native-${{ hashFiles('ios/**', 'nitrogen/**', 'ReactNativeOpenTelemetry.podspec', 'ReactNativeOpenTelemetryCore.podspec', 'example-expo/app.json', 'example-expo/plugins/**', 'example/modules/**', 'bun.lock', 'example-expo/bun.lock') }}
      - name: pod install (test mode)
        working-directory: example-expo/ios
        env:
          OTEL_TEST_MODE: '1'
        run: pod install
      - name: Build release app (test mode)
        working-directory: example-expo/ios
        env:
          OTEL_TEST_MODE: '1'
        run: >
          xcodebuild -workspace OpenTelemetryExpo.xcworkspace -scheme OpenTelemetryExpo
          -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build ARCHS=arm64 build
      - name: Pre-boot the simulator (a cold boot on the runner outlasts agent-device's boot timeout)
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: e2e (ios-expo)
        timeout-minutes: 30
        env:
          E2E_TARGET: ios-expo
          AGENT_DEVICE_DAEMON_STARTUP_TIMEOUT_MS: '600000'
        run: bun verify --e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: agent-device-state-e2e-ios-expo
          path: ~/.agent-device/
          if-no-files-found: ignore
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-artifacts-e2e-ios-expo
          path: |
            verify/artifacts/
            verify/e2e/.e2e/
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: example-expo
      - run: bun run prepare
      - run: bunx e2e-web install chromium --with-deps
      - run: bun verify --e2e e2e
        env:
          E2E_TARGET: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-artifacts-e2e-web
          path: |
            verify/artifacts/
            verify/e2e/.e2e/
          if-no-files-found: ignore
          include-hidden-files: true
