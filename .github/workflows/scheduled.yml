name: Nightly

# Spec §9.4/§9.5 (Task 31). Setup steps follow ci.yml; no native caches here: every nightly build is from scratch.
# `schedule` and `workflow_dispatch` only run workflow files from the default branch (main), so the real schedule is
# first verified after merge to main (R28). On success, `mark-nightly` marks the commit with a `nightly` status.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: setup, app regeneration and packing only (no builds, no devices, no status)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false # never cancel a real nightly

env:
  E2E_TELEMETRY_DISABLED: '1'
  DRY_RUN: ${{ inputs.dry_run == true }}

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform == 'ios' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        # platform: android | ios. app: bare (example/, default) | expo (example-expo/).
        # mode: e2e (Release, test mode, every scenario) | smoke (Release, test mode off, smoke-device) |
        #       dev (Debug + Metro, test mode, fast-refresh-idempotent).
        # rn: regenerate example/ from the RN template at that version (verify/nightly/app.sh bare, X13).
        # deps: @opentelemetry/*, otel-java (BOM) and opentelemetry-swift at their latest, plus the fast loop.
        # pack: npm pack, install the tarball into that app instead of linking the source tree (app.sh pack).
        include:
          # oldest supported (peer range >=0.79) and newest React Native
          - {name: rn-0.79-android, platform: android, rn: '0.79', mode: e2e}
          # experimental (AUTHOR GATE, VERIFY.md "Nightly"): RN 0.79.7 iOS does not build on Xcode 27 (locally: the
          # adapter podspec's module-map script phase collides with CocoaPods' own, then RN 0.79's fmt pod fails on
          # consteval). Fix both or raise the minimum RN, then drop the flag.
          - {name: rn-0.79-ios, platform: ios, rn: '0.79', mode: e2e, experimental: true}
          - {name: rn-latest-android, platform: android, rn: latest, mode: e2e}
          - {name: rn-latest-ios, platform: ios, rn: latest, mode: e2e}
          - {name: deps-latest-android, platform: android, deps: true, mode: e2e}
          - {name: deps-latest-ios, platform: ios, deps: true, mode: e2e}
          # the published package: a fresh bare app (template at latest) and the Expo app (prebuild --clean), test mode
          # off. The Expo entries are also the Expo smoke-device run (X11 interim: bare per PR, Expo here).
          - {name: pack-bare-android, platform: android, rn: latest, pack: example, mode: smoke}
          - {name: pack-bare-ios, platform: ios, rn: latest, pack: example, mode: smoke}
          - {name: pack-expo-android, platform: android, app: expo, pack: example-expo, mode: smoke}
          - {name: pack-expo-ios, platform: ios, app: expo, pack: example-expo, mode: smoke}
          # Android process-name fallback below API 28 (/proc/self/cmdline, Task 24): native init must still run
          - {name: api26-android-smoke, platform: android, api: 26, mode: smoke}
          # fast-refresh-idempotent needs Debug builds and Metro, so it is not per PR (Task 27)
          - {name: dev-android, platform: android, mode: dev}
          - {name: dev-ios, platform: ios, mode: dev}
    env:
      APP_DIR: ${{ matrix.app == 'expo' && 'example-expo' || 'example' }}
      SCHEME: ${{ matrix.app == 'expo' && 'OpenTelemetryExpo' || 'OpenTelemetryExample' }}
      CONFIGURATION: ${{ matrix.mode == 'dev' && 'Debug' || 'Release' }}
      OTEL_TEST_MODE: ${{ matrix.mode != 'smoke' && '1' || '' }}
      E2E_SMOKE: ${{ matrix.mode == 'smoke' && '1' || '' }}
      E2E_DEV: ${{ matrix.mode == 'dev' && '1' || '' }}
      E2E_TARGET: ${{ format('{0}-{1}', matrix.platform, matrix.mode == 'dev' && 'dev' || matrix.app == 'expo' && 'expo' || 'bare') }}
      AGENT_DEVICE_DAEMON_STARTUP_TIMEOUT_MS: '600000' # the first daemon start on a cold runner outlasts the default
    steps:
      - uses: actions/checkout@v4
      - if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: actions/setup-node@v4 # npm view / npm pack / the RN CLI in verify/nightly/app.sh
        with:
          node-version: '24'
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bump @opentelemetry/*, otel-java and opentelemetry-swift to latest
        if: matrix.deps
        run: |
          jq -r '.dependencies | keys[] | select(startswith("@opentelemetry/")) + "@latest"' package.json | xargs bun add
          java=$(curl -fsSL https://repo1.maven.org/maven2/io/opentelemetry/opentelemetry-bom/maven-metadata.xml |
            sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          perl -pi -e "s/opentelemetry-bom:[\d.]+/opentelemetry-bom:$java/" android/build.gradle android/core-jvm/build.gradle.kts
          for repo in opentelemetry-swift opentelemetry-swift-core; do
            v=$(git ls-remote --tags --refs "https://github.com/open-telemetry/$repo" | sed 's:.*/::; s/^v//' |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            perl -0pi -e "s|($repo\", \.upToNextMinor\(from: \")[\d.]+|\${1}$v|" Package.swift
            perl -0pi -e "s|($repo',\s*requirement: \{ kind: 'upToNextMinorVersion', minimumVersion: ')[\d.]+|\${1}$v|" \
              ReactNativeOpenTelemetryCore.podspec
            grep -qF "$repo\", .upToNextMinor(from: \"$v\")" Package.swift || { echo "::error::Package.swift: $repo not bumped"; exit 1; }
            grep -qF "minimumVersion: '$v'" ReactNativeOpenTelemetryCore.podspec || { echo "::error::podspec: $repo not bumped"; exit 1; }
          done
          # resolve the bumped Swift packages afresh
          rm -f example/ios/OpenTelemetryExample.xcworkspace/xcshareddata/swiftpm/Package.resolved
          git diff -- package.json android/build.gradle android/core-jvm/build.gradle.kts Package.swift '*.podspec'
      - run: bun install --frozen-lockfile
      - name: Regenerate example/ at React Native ${{ matrix.rn }}
        if: matrix.rn
        run: verify/nightly/app.sh bare '${{ matrix.rn }}'
      - name: Install ${{ env.APP_DIR }}
        working-directory: ${{ env.APP_DIR }}
        run: bun install ${{ !matrix.rn && '--frozen-lockfile' || '' }}
      - run: bun run prepare # the apps bundle the package through exports -> lib/ (R4)
      - name: npm pack into ${{ matrix.pack }}
        if: matrix.pack
        run: verify/nightly/app.sh pack '${{ matrix.pack }}'
      - name: Fast loop
        if: matrix.deps && env.DRY_RUN != 'true'
        # every non-e2e stage on Linux (fast-swift skips there); fast-swift on macOS
        run: bun verify ${{ matrix.platform == 'ios' && 'fast-swift' || '' }}
      - name: expo prebuild
        if: matrix.app == 'expo'
        working-directory: example-expo
        run: bunx expo prebuild --clean --no-install --platform ${{ matrix.platform }}

      - name: Build (${{ env.CONFIGURATION }})
        if: env.DRY_RUN != 'true'
        run: |
          if [ '${{ matrix.platform }}' = android ]; then
            cd "$APP_DIR/android"
            args=(":app:assemble$CONFIGURATION" -PreactNativeArchitectures=x86_64 ${OTEL_TEST_MODE:+-PotelTestMode=true})
            ./gradlew "${args[@]}" || ./gradlew "${args[@]}" # one retry: plugin and NDK downloads fail transiently
          else
            cd "$APP_DIR/ios"
            pod install # OTEL_TEST_MODE (job env) adds the Swift compilation condition
            xcodebuild -workspace "$SCHEME.xcworkspace" -scheme "$SCHEME" -configuration "$CONFIGURATION" \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build ARCHS=arm64 build
          fi
      - name: Start Metro (dev builds load their bundle from it)
        if: matrix.mode == 'dev' && env.DRY_RUN != 'true'
        working-directory: example
        run: nohup bunx react-native start > "$RUNNER_TEMP/metro.log" 2>&1 &

      - name: Enable KVM
        if: matrix.platform == 'android' && env.DRY_RUN != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: e2e (${{ env.E2E_TARGET }})
        if: matrix.platform == 'android' && env.DRY_RUN != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api || 35 }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # each line runs in its own shell
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb reverse tcp:8081 tcp:8081
            if [ "$E2E_DEV" = 1 ]; then bunx e2e run --config verify/e2e/e2e.config.ts --target "$E2E_TARGET" fast-refresh-idempotent; else bun verify --e2e e2e; fi
      - name: Pre-boot the simulator (a cold boot on the runner outlasts agent-device's boot timeout)
        if: matrix.platform == 'ios' && env.DRY_RUN != 'true'
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: e2e (${{ env.E2E_TARGET }})
        if: matrix.platform == 'ios' && env.DRY_RUN != 'true'
        run: |
          if [ "$E2E_DEV" = 1 ]; then bunx e2e run --config verify/e2e/e2e.config.ts --target "$E2E_TARGET" fast-refresh-idempotent; else bun verify --e2e e2e; fi

      - name: Metro log
        if: failure() && matrix.mode == 'dev'
        run: tail -100 "$RUNNER_TEMP/metro.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.name }}
          path: |
            verify/artifacts/
            verify/e2e/.e2e/
          if-no-files-found: ignore
          include-hidden-files: true # verify/e2e/.e2e is a dot dir

  # Marks the commit for the release gate (Task 32). A matrix entry with `experimental: true` does not block it.
  mark-nightly:
    needs: [e2e]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Mark the commit with the `nightly` status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api 'repos/${{ github.repository }}/statuses/${{ github.sha }}'
          -f state=success -f context=nightly -f description='Nightly matrix passed'
          -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
