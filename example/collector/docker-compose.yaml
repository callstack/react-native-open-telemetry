services:
  otel-collector:
    image: otel/opentelemetry-collector:0.165.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"
    depends_on:
      - zipkin

  zipkin:
    image: openzipkin/zipkin:3.6.1
    ports:
      - "9411:9411"
