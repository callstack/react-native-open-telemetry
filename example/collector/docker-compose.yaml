services:
  otel-collector:
    image: otel/opentelemetry-collector:0.165.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"
