# Official OpenTelemetry Collector for the compliance job (Task 30): receives OTLP/HTTP, decodes every span, logs it.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
